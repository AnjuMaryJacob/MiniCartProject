<!DOCTYPE html>
<html>
<head>
    <title>Update Order #{{ order.id }}</title>
</head>

<body>

<h1>Update Order #{{ order.id }}</h1>

<p>
    Current Status: {{ order.status }}
</p>

<form method="POST">

    {% csrf_token %}

    <label for="status">
        Select Status:
    </label>

    <select name="status" id="status">

        {% for value, label in status_choices %}

            <option
                value="{{ value }}"
                {% if order.status == value %}selected{% endif %}
            >
                {{ label }}
            </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">
        Update Order
    </button>

</form>

<br>

<a href="{% url 'order_detail' order.id %}">
    Back to Order
</a>

</body>
</html>
