<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>

<body>

{% if profile %}
    <h1>Update Profile</h1>
{% else %}
    <h1>Create Profile</h1>
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        {% if profile %}
            Update Profile
        {% else %}
            Create Profile
        {% endif %}
    </button>

</form>

<br>

<a href="{% url 'profile_detail' %}">
    Back to Profile
</a>

</body>
</html>
