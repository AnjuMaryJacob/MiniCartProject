<!DOCTYPE html>
<html>

<head>
    <title>Delete Product</title>
</head>

<body>

<h1>Delete Product</h1>

<h2>{{ product.name }}</h2>

<p>
    Are you sure you want to delete this product?
</p>

<p>
    Price: ₹{{ product.price }}
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete Product
    </button>

    <a href="{% url 'product_detail' product.id %}">
        Cancel
    </a>

</form>

</body>

</html>
